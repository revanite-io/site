story: |
  Unfortunately, you’re in completely over your head. Historians decades from now may ponder your motivation: What led this individual to say ‘yes’ to everything Santa asked, regardless of their actual knowledge on the topic?

  Was it delusions of grandeur? A prime example of the Dunning-Kreuger effect? Malicious deception? Overwhelmed panic?

  Regardless, it’s up to you now to determine how the story ends. Will you rise to meet the occasion, or slink away into obscurity? Will you mail it in and hope that the elfs solve the problem on their own, or will you push yourself to truly understand the topic and rise to the occasion?

  Before your thoughts could spiral further, something up ahead draws your attention. For the past hour all you’ve seen is a red glow refracting from the biting cold mist sweeping past you. Only the light from your phone screen gave any variation to the mind-numbing repetition.

  But now you see something new: a white light in the foggy darkness.

  You can’t make out any more quite yet, so you return to your notes.

  *Back to Basics* was written in title font at the top.

  > Gemara is a philosophical model for automated risk assessment. The technical ecosystem includes document specifications and software development kits (SDKs).

  It was old news, but you needed it memorized to distill it for the client.

  > Helps with cross-team interoperability, tooling orchestration for security and compliance, and history/traceability in regulated contexts.

  Beneath that you had a scattering of reminders for the first conversation.

  > Make sure they understand audits. Different from evaluations, audits contain a look back on every policy and how well it was implemented. Represent someone’s comprehensive opinion based on multiple data points. Contents depend on the organizational policy. Scoped for a particular situation or deployment.

  Your notes link to the Gemara website for more of the philosophy behind audits.

  > Everyone wants to start with policy. That’s good, but remind them that policy is also a compilation document. Needs pre-defined risks, guidance, and requirements before the policy is complete.

  The sleigh flies rapidly closer to the light, descending now. The clustered light begin to take the shape of a small settlement — a rainbow of colored lights scattered across the ice. It was a small city, with hundreds of buildings in a tight, colorful mosaic.

  Surrounding the little city were countless little black pockmarks against the white surface. At first it was difficult to discern any more from your distance, but the realization dawned as the sleigh flew straight toward the ground. They were tunnels. And you were headed straight for one.

  The sleigh bumped down, terrifyingly snug but oddly smooth as its speed was dampened by a sparkling magic aura that seemed to emanate from the ice itself.

  Then suddenly, some of those sparkles coalesced into a familiar humanoid shape: Santa Clause.

  “Ho, ho, ho! Merry Christmas!” Santa said with a jolly grin and a pat on his plump belly. “Well, it will be a merry Christmas — with your help!”

  You greet Santa for the second time in your life… twice more than any human is likely to ever have the chance.

  The red coated man scattered a bag of carrots onto the floor of the ice tunnel, then turned his back and gestured for you to follow.

  “Listen, friend,” Santa leaned down to whisper conspiratorily. “You’ve seen some clues tonight already, but I’ll make you a deal. If you set up a system that keeps me out of trouble with the Europeans, I promise to tell you how we pull off the Christmas distribution. And I’ll make you another promise — it’ll blow your stockings off. It’s nothing like you’ve seen in any of the fairy tails or christmas movies.”

  Santa led you through a long tunnel, chatting the entire way about nothing at all. Candies and toys seemed to be his favorite topics, with no surprises in the conversation at all. You were surprised, however, to notice that the tunnel you walked along had ample signage with magical lighting, marking directions at every fork. The forks always led backwards, though. Your path was leading toward the center of something massive.

  After what felt like forever in the disorienting white tunnel, your path ended at a large steel door with the number one painted in red from top to bottom.

  Santa opened the door and you were met with a wave of heat.

  “The magic down here keeps the ice from melting,” Santa smiled, “But elfs work best in the comfort of a warm workshop.”

  Impossible daylight filled the hall, coming in from windows that couldn’t have led outdoors. Hardwood floors lined the hall, leading to a broad staircase with steps sized just a bit too large for an elf and a bit too small for Santa’s large stature. Apparently human-sized steps are the perfect middle-ground for the two antonymous creatures.

  Just before reaching the top of the staircase, you notice something odd. A pair of rails ran along each wall of the staircase, just above the floor.

  “Here we are,” Santa gestured to a door on the right wall.

  The long hallway continued further, toward a massive set of double doors, with the strange rails continuing along the wall. Even the door had the strange rail cutting through it. Halfway up the door were stenciled letters painted in both red and green this time.

  “Manager’s Office”

  Santa swung the door open and walked in with an air of bravado.

  “Sandy, your new colleague has arrived!”

  The creature that sat in front of you was humanoid, but like Santa… not quite human. He wasn’t like any dwarf you’d ever met, and he didn’t look like a child or anything that a human actor could accurately portray. It was like like staring at an alien and a familiar face at the same time — the uncanny valley brought to life in front of you.

  Standing up from behind the desk, he reached barely four feet nine inches, carrying a slender, lithe frame of perhaps a hundred pounds. His entire body looked like an impossible evolutionary collage: long, wiry limbs and hunched, primitive shoulders that belonged to an ape from three million years ago.

  His smile looked foreign, impossible to discern.

  “I’m not going to say I’m excited to have you here, but I’m optimistic that we’ll get this all sorted out in a jiffy.”

  He extended a hand across the desk. His impossibly long arms carried hands and fingers that looked nearly identical to your own. As you shake his hand, you feel like it might pop right off… like a man’s hand on a child’s wrist.

  Beneath a heavy, shelf-like brow ridge sat a shockingly compact head, with a head the size of a grapefruit. His nose was flat and his jaw jutted forward with primal strength, yet when he offered a faint half-smile, he revealed a neat row of small, human-shaped teeth.

  Santa read your expression… or your aura… or whatever it is he does to know what humans are thinking.

  “Elfs have a powerful bone and muscle density,” he said with a laugh. “Don’t worry about a thing. The closest elf relative your people have discovered is the Homo naledi. A very rare and seclusive species; they’ve never gotten on well with humans.”

  “My name is Sandabütz,” the elf said.

  “But you can call him Sandy,” Santa interjected.

  “My name comes from a nickname my father received when he used to play tricks on townsfolk perhaps one or two hundred years before I was born. The sand sprite, they called him.”

  “Humans depend on their big brains,” Santa laughed, “And elfs rely on the Otherworld. I have both! Best of both worlds.”

  Sandabütz shook his head at Santa’s comment. “So tell me about this solution of yours. I believe it’s called Gemara, if Santa’s notes were accurate.”

