<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Social preview for /guides/advent-of-gemara. Render with: scripts/og/render.sh advent-of-gemara-og-v2
       Colours match the teaser page (the advent block in src/styles/global.css). The font is Source Serif 4
       (60pt SemiBold, SIL OFL 1.1), subset to the glyphs of "Advent of Gemara" and embedded as WOFF2 with
       fontTools.subset (text "Advent of Gemara", flavor woff2). Changing the title means re-subsetting.
       XML comments cannot contain a double hyphen, so the command is in scripts/og/README.md. -->
  <style>
    @font-face {
      font-family: 'Source Serif 4 OG';
      font-weight: 600;
      src: url(data:font/woff2;base64,) format('woff2');
    }
    .title { font-family: 'Source Serif 4 OG', serif; font-weight: 600; font-size: 124px; letter-spacing: -1px; fill: #1d5b45; }
  </style>
  <defs>
    <!-- Light snowfall, as behind the page header. -->
    <pattern id="snow-a" width="37" height="37" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.6" fill="#e2dccf" />
    </pattern>
    <pattern id="snow-b" width="61" height="61" patternUnits="userSpaceOnUse" x="19" y="23">
      <circle cx="4" cy="4" r="2.2" fill="#ebe6dc" />
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#faf7f1" stop-opacity="1" />
      <stop offset="0.55" stop-color="#faf7f1" stop-opacity="0.85" />
      <stop offset="1" stop-color="#faf7f1" stop-opacity="0" />
    </radialGradient>
    <!-- Four-point star, radius 1. -->
    <path id="star" d="M0,-1 Q0,0 1,0 Q0,0 0,1 Q0,0 -1,0 Q0,0 0,-1 Z" />
  </defs>

  <rect width="1200" height="630" fill="#f6f2ea" />
  <rect width="1200" height="630" fill="url(#snow-a)" />
  <rect width="1200" height="630" fill="url(#snow-b)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="14" fill="#9b1c2c" />
  <rect y="616" width="1200" height="14" fill="#9b1c2c" />

  <g fill="#a8823a">
    <use xlink:href="#star" transform="translate(552 212) scale(11)" />
    <use xlink:href="#star" transform="translate(600 206) scale(19)" />
    <use xlink:href="#star" transform="translate(648 212) scale(11)" />
  </g>

  <text class="title" x="600" y="362" text-anchor="middle">Advent of Gemara</text>

  <g fill="#a8823a">
    <rect x="470" y="421" width="110" height="2" />
    <rect x="620" y="421" width="110" height="2" />
    <use xlink:href="#star" transform="translate(600 422) scale(8)" fill="#9b1c2c" />
  </g>
</svg>
