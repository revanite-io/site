# Sample workflow for building and deploying a Vite/React site to GitHub Pages
name: Deploy Vite site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Daily rebuild publishes entries whose `date:` has arrived (Advent of Gemara releases a day at a time).
  # 05:00 UTC is midnight US Eastern.
  schedule:
    - cron: "0 5 * * *"

# Deny all permissions by default
permissions: {}

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Clone the repository
    outputs:
      build_date: ${{ steps.build.outputs.build_date }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install dependencies
        run: npm ci
      - name: Build
        id: build
        env:
          NODE_ENV: production
        # Pin the release clock for this build so the live check below expects the same pages.
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          BUILD_DATE=$BUILD_DATE npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write    # Deploy to GitHub Pages
      id-token: write # Federate via Workload Identity
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Fails the run if the deployed site does not match the release rule (e.g. today's Advent day is
  # missing, an unreleased day is live, or the homepage banner has the wrong wording).
  verify:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    permissions:
      contents: read # Clone the repository
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the live site against the release rule
        env:
          SITE: ${{ needs.deploy.outputs.page_url }}
          BUILT: ${{ needs.build.outputs.build_date }}
        run: ./scripts/check-live.sh "$SITE" "$BUILT"
